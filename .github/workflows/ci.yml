name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: context budget
        run: scripts/measure-context.sh --check
      - name: docs commands
        run: python3 scripts/check-docs.py

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build
        run: cargo build --locked --all-targets

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: shellcheck install.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
      - name: actionlint
        run: ./actionlint .github/workflows/ci.yml crates/relaybook/templates/graphify-update.yml

  release:
    name: release (${{ matrix.artifact }})
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: relaybook-linux-x86_64
            binary: relaybook
            archive: tar.gz
            crt: "false"
            smoke: "false"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: relaybook-macos-aarch64
            binary: relaybook
            archive: tar.gz
            crt: "false"
            smoke: "false"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: relaybook-windows-x86_64
            binary: relaybook.exe
            archive: zip
            crt: "true"
            smoke: "true"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: relaybook-windows-aarch64
            binary: relaybook.exe
            archive: zip
            crt: "true"
            smoke: "true"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: install musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: build
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.crt == 'true' && '-C target-feature=+crt-static' || '' }}
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            export CC_x86_64_unknown_linux_musl=musl-gcc
            export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
          fi
          cargo build --release --target "${{ matrix.target }}"
      - name: assert static
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bin="target/${{ matrix.target }}/release/relaybook"
          file "$bin"
          file "$bin" | grep -Eq 'statically linked|static-pie linked'
          set +e
          ldd_out=$(ldd "$bin" 2>&1)
          set -e
          printf '%s\n' "$ldd_out"
          printf '%s\n' "$ldd_out" | grep -Eq 'statically linked|not a dynamic executable'
          if printf '%s\n' "$ldd_out" | grep -q '\.so'; then
            echo "binary links shared libraries" >&2
            exit 1
          fi
      - name: no visual c runtime
        if: matrix.crt == 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = "$env:ProgramFiles\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          $dumpbin = & $vswhere -latest -find "**\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin not found" }
          $exe = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $deps = & $dumpbin /dependents $exe
          $deps | Write-Output
          $imported = $deps | Where-Object { $_ -match "(?i)(VCRUNTIME|MSVCP).*\.dll" }
          if ($imported) {
            throw "exe imports the Visual C++ runtime: $($imported -join ', ')"
          }
      - name: smoke
        if: matrix.smoke == 'true'
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/${{ matrix.target }}/release/relaybook.exe").Path
          $work = Join-Path $env:RUNNER_TEMP "relaybook-smoke"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          git -C $work init -b main
          git -C $work config user.email relaybook@example.com
          git -C $work config user.name Relaybook
          function Invoke-Relaybook([string[]]$RelayArgs) {
            & $exe @RelayArgs
            if ($LASTEXITCODE -ne 0) {
              throw "relaybook $($RelayArgs -join ' ') exited $LASTEXITCODE"
            }
          }
          Set-Location $work
          Invoke-Relaybook -RelayArgs @("--version")
          Invoke-Relaybook -RelayArgs @("init")
          Invoke-Relaybook -RelayArgs @("task", "create", "greet", "--title", "Say hello")
          Invoke-Relaybook -RelayArgs @("context")
          Invoke-Relaybook -RelayArgs @("setup", "--no-graphify")
      - name: package tarball
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.binary }}"
          tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.binary }}"
          ls -l "${{ matrix.artifact }}.tar.gz"
      - name: package zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "${{ matrix.binary }}"
          tar.exe -a -c -f "${{ matrix.artifact }}.zip" "${{ matrix.binary }}"
          tar.exe -tf "${{ matrix.artifact }}.zip"
          Get-Item "${{ matrix.artifact }}.zip" | Select-Object Name, Length
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.archive }}

  linux-containers:
    name: linux containers
    needs: release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: relaybook-linux-x86_64
      - name: unpack
        run: tar -xzf relaybook-linux-x86_64.tar.gz && chmod +x relaybook
      - name: ubuntu 20.04
        run: |
          mkdir -p ubuntu-work
          docker run --rm \
            -v "$PWD/relaybook:/relaybook:ro" \
            -v "$PWD/ubuntu-work:/work" \
            -w /work \
            ubuntu:20.04 \
            bash -c '/relaybook --version && /relaybook init && /relaybook task create greet --title "Say hello" && /relaybook context'
      - name: alpine
        run: |
          mkdir -p alpine-work
          docker run --rm \
            -v "$PWD/relaybook:/relaybook:ro" \
            -v "$PWD/alpine-work:/work" \
            -w /work \
            alpine:latest \
            sh -c '/relaybook --version && /relaybook init && /relaybook task create greet --title "Say hello" && /relaybook context'

  publish:
    name: publish
    needs: [release, linux-containers]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip \
            --title "${GITHUB_REF_NAME}" \
            --notes "Relaybook ${GITHUB_REF_NAME}"
