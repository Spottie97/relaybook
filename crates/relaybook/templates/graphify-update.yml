# Opt-in Graphify refresh. `graphify update` is AST-only and does not call an LLM.
# If any secret below is set, the job runs `graphify extract` instead. Extract sends
# repository text to that provider and spends its API credits. Secret names match the
# environment variables Graphify reads: GEMINI_API_KEY, GOOGLE_API_KEY,
# ANTHROPIC_API_KEY, OPENAI_API_KEY, DEEPSEEK_API_KEY, MOONSHOT_API_KEY, and
# AZURE_OPENAI_API_KEY (with AZURE_OPENAI_ENDPOINT).
#
# The pull request step needs Settings > Actions > General >
# "Allow GitHub Actions to create and approve pull requests".
# A pull request opened with GITHUB_TOKEN does not trigger other workflows, so
# required checks will not run on graphify/update. Set the GRAPHIFY_PR_TOKEN secret
# to a fine-grained PAT or GitHub App token with contents and pull-requests write
# when those checks must run. GITHUB_TOKEN is the fallback.
name: graphify-update

on:
  push:
    branches: [main]
    paths-ignore:
      - "graphify-out/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: install graphify
        run: uv tool install graphifyy
      - name: put uv tools on PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: refresh graph
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
        run: |
          keys="${GEMINI_API_KEY}${GOOGLE_API_KEY}${ANTHROPIC_API_KEY}${OPENAI_API_KEY}${DEEPSEEK_API_KEY}${MOONSHOT_API_KEY}${AZURE_OPENAI_API_KEY}"
          if [ -n "$keys" ]; then
            graphify extract .
          else
            graphify update .
          fi
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GRAPHIFY_PR_TOKEN || github.token }}
          commit-message: "chore: refresh graphify graph"
          branch: graphify/update
          title: "chore: refresh Graphify graph"
          body: |
            Refresh `graphify-out` from main. The job uses `graphify extract` when an
            LLM API secret is set, and `graphify update` otherwise. This opens a pull
            request so branch protection still applies.
          add-paths: graphify-out
