[package]
name = "relaybook"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Shared coordination ledger for coding agents"
publish = false

[[bin]]
name = "relaybook"
path = "src/main.rs"

[dependencies]
relaybook-core = { path = "../core", version = "0.3.3" }
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12"
serde = "1.0.229"
serde_json = "1.0.154"
which = "7"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
